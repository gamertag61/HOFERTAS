<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heleos</title>
<meta name="theme-color" content="#000000">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { sun: '#ffb340', coal: '#0b0b0c' } } } };
</script>
<style>
  html, body { background: #000; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }

  /* Entrada en cascada */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i, 0) * 80ms); }

  /* Héroe: diapositivas apiladas en la misma celda */
  .slide { grid-area: 1 / 1; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility .9s; }
  .slide.on { opacity: 1; visibility: visible; }
  .slide img { transform: scale(1.06); transition: transform 6s ease-out; }
  .slide.on img { transform: scale(1); }

  /* Indicadores con progreso de 5 s */
  @keyframes fill { from { width: 0; } to { width: 100%; } }
  .dot i { display: block; height: 100%; width: 0; background: #ffb340; }
  .dot.on i { animation: fill 5s linear forwards; }

  a:focus-visible, button:focus-visible { outline: 2px solid #ffb340; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; }
    .slide, .slide img, .card img { transition: none; }
    .dot.on i { animation: none; width: 100%; }
  }
</style>
</head>
<body class="min-h-screen bg-black text-zinc-100 antialiased">

<!-- Cabecera -->
<header class="rise mx-auto max-w-6xl px-4 pt-3" style="--i:0">
  <div class="text-center text-xs text-zinc-400">Ofertas del día (Expiran pronto)</div>
  <div class="mx-auto mt-2 h-px w-full max-w-xs overflow-hidden bg-zinc-800" aria-hidden="true">
    <div id="dia" class="h-full bg-sun" style="width:0"></div>
  </div>
  <div class="flex items-center justify-center gap-2 py-5">
    <span class="h-2.5 w-2.5 rounded-full bg-sun shadow-[0_0_14px_3px_rgba(255,179,64,.55)]"></span>
    <span class="text-2xl font-semibold tracking-tight">Heleos</span>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 pb-16">

  <!-- Héroe -->
  <section class="rise relative overflow-hidden rounded-[2rem] bg-coal" style="--i:1" aria-roledescription="carrusel" aria-label="Ofertas destacadas">
    <div id="hero" class="grid"></div>
    <div id="dots" class="absolute inset-x-0 bottom-4 flex justify-center gap-2 md:justify-start md:px-12"></div>
  </section>

  <!-- Vitrina -->
  <section id="grid" class="mt-8 grid grid-cols-2 gap-3 sm:gap-5 md:grid-cols-3 lg:grid-cols-4"></section>
</main>

<script>
(() => {
  const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
  const img = (txt, bg) => `https://placehold.co/800x800/${bg}/e8e8ea?text=${encodeURIComponent(txt)}`;

  // Reemplaza las imágenes por fotos reales (Unsplash o las de Mercado Libre)
  const P = [
    { t: 'Audífonos inalámbricos con cancelación activa de ruido y 40 h de batería', o: 1899, n: 1199, i: img('Audifonos', '161618') },
    { t: 'Monitor gamer curvo 27 pulgadas QHD a 165 Hz con panel VA', o: 5499, n: 3899, i: img('Monitor', '131316') },
    { t: 'Teclado mecánico compacto 75% inalámbrico con switches intercambiables', o: 1799, n: 1149, i: img('Teclado', '171719') },
    { t: 'Smartwatch con GPS, monitor de sueño y pantalla AMOLED', o: 2399, n: 1549, i: img('Smartwatch', '151517') },
    { t: 'Mouse ergonómico inalámbrico de 26,000 DPI y 70 h de autonomía', o: 1299, n: 799, i: img('Mouse', '181819') },
    { t: 'Bocina Bluetooth portátil resistente al agua con graves profundos', o: 1599, n: 989, i: img('Bocina', '141416') }
  ];
  const H = [
    { p: 2, h: 'Escribe a otro nivel' },
    { p: 1, h: 'Cada fotograma, más fluido' },
    { p: 0, h: 'Tu música, sin el ruido' }
  ];
  const off = p => Math.round((1 - p.n / p.o) * 100);

  // Héroe
  const hero = document.getElementById('hero');
  const dots = document.getElementById('dots');
  hero.innerHTML = H.map((s, k) => {
    const p = P[s.p];
    return `
    <article class="slide ${k === 0 ? 'on' : ''} grid md:grid-cols-2 md:items-center" aria-hidden="${k !== 0}">
      <div class="aspect-[4/3] overflow-hidden md:aspect-square md:max-h-[460px]">
        <img src="${p.i}" alt="" class="h-full w-full object-cover" ${k ? '' : 'fetchpriority="high"'}>
      </div>
      <div class="px-6 pb-14 pt-5 md:px-12 md:pb-0">
        <h2 class="text-3xl font-semibold leading-tight tracking-tight md:text-5xl">${s.h}</h2>
        <p class="mt-2 line-clamp-2 text-sm text-zinc-400 md:text-base">${p.t}</p>
        <div class="mt-4 flex items-baseline gap-3">
          <span class="text-3xl font-semibold text-sun">${mxn.format(p.n)}</span>
          <span class="text-zinc-500 line-through">${mxn.format(p.o)}</span>
          <span class="rounded-full bg-sun/15 px-2.5 py-0.5 text-xs font-semibold text-sun">-${off(p)}%</span>
        </div>
        <a href="#" class="mt-5 inline-block rounded-full bg-white px-7 py-3 text-sm font-semibold text-black transition hover:bg-sun active:scale-95">Comprar con descuento</a>
      </div>
    </article>`;
  }).join('');
  dots.innerHTML = H.map((_, k) =>
    `<button class="dot ${k === 0 ? 'on' : ''} h-1 w-9 overflow-hidden rounded-full bg-zinc-700" aria-label="Oferta ${k + 1}"><i></i></button>`).join('');

  const slides = [...hero.children], ds = [...dots.children];
  let cur = 0, timer;
  function go(k) {
    slides[cur].classList.remove('on'); slides[cur].setAttribute('aria-hidden', 'true'); ds[cur].classList.remove('on');
    cur = k;
    slides[cur].classList.add('on'); slides[cur].setAttribute('aria-hidden', 'false');
    void ds[cur].offsetWidth;            // reinicia la animación de progreso
    ds[cur].classList.add('on');
  }
  function start() { clearInterval(timer); timer = setInterval(() => go((cur + 1) % slides.length), 5000); }
  ds.forEach((d, k) => d.addEventListener('click', () => { go(k); start(); }));
  document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : (go(cur), start()));
  start();

  // Vitrina
  document.getElementById('grid').innerHTML = P.map((p, k) => `
    <article class="card rise group flex flex-col" style="--i:${k + 3}">
      <a href="#" class="relative block overflow-hidden rounded-3xl bg-coal" tabindex="-1" aria-hidden="true">
        <img src="${p.i}" alt="" loading="lazy" class="aspect-square w-full object-cover transition duration-500 ease-out group-hover:scale-105">
        <span class="absolute left-3 top-3 rounded-full bg-black/70 px-2.5 py-1 text-xs font-semibold text-sun backdrop-blur">-${off(p)}%</span>
      </a>
      <h3 class="mt-3 line-clamp-2 min-h-[2.5rem] px-1 text-sm leading-5 text-zinc-200">${p.t}</h3>
      <div class="mt-2 flex items-baseline gap-2 px-1">
        <span class="text-lg font-semibold text-sun drop-shadow-[0_0_10px_rgba(255,179,64,.35)]">${mxn.format(p.n)}</span>
        <span class="text-sm text-zinc-500 line-through">${mxn.format(p.o)}</span>
      </div>
      <a href="#" class="mt-3 block rounded-full border border-zinc-700 py-2.5 text-center text-sm font-medium text-zinc-100 transition hover:border-white hover:bg-white hover:text-black active:scale-95">Aprovechar oferta</a>
    </article>`).join('');

  // Barra sutil: avance del día
  const d = new Date(), pct = ((d.getHours() * 60 + d.getMinutes()) / 1440) * 100;
  document.getElementById('dia').style.width = pct.toFixed(1) + '%';
})();
</script>
</body>
</html>
