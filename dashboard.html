<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H | Ofertas · Centro de Control</title>
<meta name="theme-color" content="#0a0b0d">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { lima: '#c6f135', tinta: '#0a0b0d', grafito: '#101215', mate: '#15171b', alto: '#1b1e23', linea: '#24272d', humo: '#9aa0a8', ceniza: '#6b7079' },
    fontFamily: { sans: ['Poppins', 'ui-sans-serif', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] }
  } } };
</script>
<style>
  :root { --lima: #c6f135; --tinta: #0a0b0d; --ease: cubic-bezier(.16, 1, .3, 1); color-scheme: dark; }
  html, body { height: 100%; overflow: hidden; background: var(--tinta); }
  body { -webkit-text-size-adjust: 100%;
    background: radial-gradient(ellipse 60% 30% at 50% -5%, rgba(198,241,53,.06), transparent 70%), var(--tinta); }
  ::selection { background: var(--lima); color: var(--tinta); }
  textarea, input { caret-color: var(--lima); }
  .num { font-variant-numeric: tabular-nums; }

  /* Barras de scroll internas con la paleta */
  .scroll { scrollbar-width: thin; scrollbar-color: #2c3037 transparent; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: #2c3037; border-radius: 9999px; border: 2px solid var(--tinta); }

  /* Entrada en cascada */
  @keyframes rise { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
  .rise { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }

  /* Controles */
  .press { transition: transform 160ms var(--ease), filter 160ms ease, background-color 160ms ease, color 160ms ease, border-color 160ms ease, opacity 160ms ease; }
  .press:active:not(:disabled) { transform: scale(.97); }
  .btn-lima { background: var(--lima); color: var(--tinta); }
  .btn-lima:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-lima:disabled { background: rgba(198,241,53,.12); color: rgba(198,241,53,.6); cursor: not-allowed; }
  .campo { background: #101215; border: 1px solid #24272d; transition: border-color 160ms ease, background-color 160ms ease; }
  .campo:hover { border-color: #33373f; }
  .campo:focus { outline: none; border-color: rgba(198,241,53,.55); background: #121417; }
  .campo::placeholder { color: #6b7079; }

  /* Tarjetas del feed */
  .oferta { transition: border-color .2s ease; }
  .oferta:hover { border-color: #3a3f2a; }

  /* Aviso de estado bajo el botón */
  .aviso { transition: opacity 220ms ease, translate 220ms var(--ease); }
  .aviso:empty { opacity: 0; translate: 0 -4px; }

  @keyframes latido { 0% { box-shadow: 0 0 0 0 rgba(198,241,53,.55); } 70%, 100% { box-shadow: 0 0 0 6px rgba(198,241,53,0); } }
  .latido { animation: latido 2.4s ease-out infinite; }

  /* Teleprompter */
  #prompter { opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .25s; }
  #prompter.abierto { opacity: 1; visibility: visible; transition: opacity .25s ease; }
  #prompter .hoja { translate: 0 16px; transition: translate .35s var(--ease); }
  #prompter.abierto .hoja { translate: 0 0; }
  #guion { font-size: var(--tam, 2rem); }
  #guion p + p { margin-top: 1.1em; }

  @keyframes brillo { to { background-position: -200% 0; } }
  .esq { background: linear-gradient(90deg, #15171b 0%, #1d2026 50%, #15171b 100%); background-size: 200% 100%; animation: brillo 1.4s linear infinite; }

  a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--lima); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .rise, .latido, .esq { animation: none; }
    .press, .campo, .aviso, .oferta, #prompter, #prompter .hoja { transition: none; }
  }
</style>
</head>
<body class="font-sans text-zinc-100 antialiased">

<main class="mx-auto flex h-screen w-full max-w-3xl flex-col gap-3 p-3" aria-label="Panel de control">

  <!-- CAJA SUPERIOR · Enlaces (altura fija moderada) -->
  <section id="caja-enlaces" class="rise flex h-56 shrink-0 flex-col rounded-3xl border border-linea bg-grafito p-4" style="--i:0" aria-labelledby="t-enlaces">
    <header class="flex shrink-0 items-center justify-between gap-3">
      <h2 id="t-enlaces" class="flex items-baseline gap-2 text-base font-bold tracking-tight">
        <span class="flex items-baseline font-extrabold"><span>H</span><span class="mx-1 font-normal text-humo">|</span><span>Ofertas</span><span class="ml-0.5 inline-block h-1.5 w-1.5 rounded-full bg-lima"></span></span>
        <span class="text-humo">Enlaces</span>
      </h2>
      <span class="flex items-center gap-1">
        <span id="conteo" class="num font-mono text-[11px] text-humo">0 enlaces</span>
        <button id="ajustes" type="button" class="press -mr-1.5 grid h-8 w-8 place-items-center rounded-full text-humo hover:bg-white/5 hover:text-zinc-100" aria-label="Conexión con GitHub" aria-expanded="false" aria-controls="conexion" title="Conexión con GitHub">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5L9.8 5.2M12 8a3.5 3.5 0 0 0-5 0L4.5 10.5a3.5 3.5 0 0 0 5 5l.7-.7"/></svg>
        </button>
      </span>
    </header>
    <!-- Conexión con GitHub: guarda enlaces.txt en el repositorio -->
    <form id="conexion" class="mt-3 hidden shrink-0 flex-col gap-2 border-b border-linea pb-3">
      <label class="text-xs text-humo" for="gh-repo">Repositorio</label>
      <input id="gh-repo" type="text" autocomplete="off" spellcheck="false" placeholder="usuario/repositorio" class="campo h-9 rounded-full px-4 font-mono text-[12px] text-zinc-100">
      <label class="text-xs text-humo" for="gh-token">Token (solo Contents: lectura y escritura)</label>
      <input id="gh-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" class="campo h-9 rounded-full px-4 font-mono text-[12px] text-zinc-100">
      <div class="mt-1 flex items-center gap-2">
        <button type="submit" class="press flex-1 rounded-full border border-linea py-2 text-xs font-semibold text-zinc-100 hover:border-zinc-500">Conectar</button>
        <button type="button" id="gh-olvidar" class="press rounded-full px-3 py-2 text-xs text-humo hover:text-zinc-100">Olvidar</button>
      </div>
      <p id="gh-estado" class="text-xs text-humo" role="status"></p>
    </form>
    <label for="municion" class="sr-only">Enlaces de afiliado, uno por línea</label>
    <div class="mt-2.5 flex min-h-0 flex-1 gap-2">
      <textarea id="municion" spellcheck="false" autocomplete="off"
                placeholder="https://meli.la/…&#10;Pega con Ctrl+V: cada enlace queda en su línea"
                class="campo scroll block min-h-0 w-full flex-1 resize-none rounded-2xl px-4 py-2.5 font-mono text-[13px] leading-6 text-zinc-200"></textarea>
    </div>
    <div class="mt-2.5 flex shrink-0 items-center gap-3">
      <button id="guardar" type="button" class="press btn-lima shrink-0 rounded-full px-5 py-2.5 text-sm font-semibold" disabled>Guardar enlaces</button>
      <p id="aviso-municion" class="aviso min-w-0 flex-1 truncate text-xs text-humo" role="status"></p>
    </div>
  </section>

  <!-- CAJA INFERIOR · Módulo IA: feed de súper ofertas -->
  <section class="rise flex min-h-0 flex-1 flex-col overflow-hidden rounded-3xl border border-linea bg-grafito" style="--i:1" aria-labelledby="t-ia">
    <header class="flex shrink-0 items-end justify-between gap-3 border-b border-linea px-5 pb-4 pt-5">
      <div>
        <h2 id="t-ia" class="flex items-center gap-2.5 text-xl font-bold tracking-tight">
          <span class="latido h-2 w-2 rounded-full bg-lima" aria-hidden="true"></span>Módulo IA
        </h2>
        <p id="origen" class="num mt-1 font-mono text-xs text-humo">Cargando súper ofertas…</p>
      </div>
      <span id="reloj" class="num font-mono text-xs text-humo"></span>
    </header>
    <ol id="feed" class="scroll flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto px-4 py-4 sm:px-5" aria-live="polite" aria-label="Feed de súper ofertas"></ol>
  </section>
</main>

<!-- Teleprompter: modal a pantalla completa -->
<div id="prompter" role="dialog" aria-modal="true" aria-labelledby="p-titulo" class="fixed inset-0 z-50 bg-black">
  <div class="hoja mx-auto flex h-[100dvh] max-w-2xl flex-col">
    <div class="flex shrink-0 items-center gap-3 px-5 pb-3 pt-5">
      <button id="cerrar" type="button" aria-label="Cerrar guion" class="press btn-lima grid h-14 w-14 shrink-0 place-items-center rounded-full">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 id="p-titulo" class="min-w-0 flex-1 truncate text-sm font-semibold text-humo">Guion</h2>
      <div class="flex shrink-0 gap-1.5" role="group" aria-label="Tamaño del texto">
        <button id="menos" type="button" aria-label="Texto más chico" class="press grid h-11 w-11 place-items-center rounded-full border border-linea text-sm font-bold text-zinc-200">A−</button>
        <button id="mas" type="button" aria-label="Texto más grande" class="press grid h-11 w-11 place-items-center rounded-full border border-linea text-base font-bold text-zinc-200">A+</button>
      </div>
    </div>
    <div id="guion" class="scroll min-h-0 flex-1 overflow-y-auto px-7 pb-10 pt-4 font-bold leading-[1.3] tracking-[-0.01em] text-zinc-50"></div>
  </div>
</div>

<script src="nombres.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nombre = window.nombreComercial;
  const off = p => Math.round((1 - p.n / p.o) * 100);
  const enlace = url => `href="${esc(url)}" target="_blank" rel="noopener noreferrer sponsored"`;

  /* ---------- Ingreso de enlaces ---------- */
  const caja = $('municion'), guardar = $('guardar'), avisoM = $('aviso-municion'), conteo = $('conteo');
  const BORRADOR = 'heleos.municion'; // clave previa: conserva el borrador guardado
  try { caja.value = localStorage.getItem(BORRADOR) || ''; } catch {}

  const lineas = () => caja.value.split('\n').map(l => l.trim()).filter(Boolean);
  const validas = () => [...new Set(lineas().filter(l => /^https?:\/\/\S+$/i.test(l)))];
  function contar() {
    const ls = lineas(), vs = validas(), malas = ls.filter(l => !/^https?:\/\/\S+$/i.test(l)).length;
    conteo.textContent = `${vs.length} ${vs.length === 1 ? 'enlace' : 'enlaces'}` + (malas ? ` · ${malas} sin URL` : '');
    conteo.classList.toggle('text-lima', malas > 0);
    guardar.disabled = !vs.length;
    try { localStorage.setItem(BORRADOR, caja.value); } catch {}
  }
  let avisoT;
  function avisar(el, txt) { clearTimeout(avisoT); el.textContent = txt; el.title = txt; avisoT = setTimeout(() => (el.textContent = ''), 6000); }

  // Enter al final de un enlace: limpia espacios y salta a una línea nueva limpia.
  caja.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    const v = caja.value, a = caja.selectionStart, b = caja.selectionEnd;
    const inicio = v.lastIndexOf('\n', a - 1) + 1;
    const antes = v.slice(0, inicio) + v.slice(inicio, a).trimEnd();
    caja.value = antes + '\n' + v.slice(b).replace(/^[ \t]+/, '');
    caja.selectionStart = caja.selectionEnd = antes.length + 1;
    contar();
  });
  // Ctrl+V: cada pegado queda en su propia línea y el cursor espera en el renglón de abajo.
  caja.addEventListener('paste', e => {
    const txt = (e.clipboardData || window.clipboardData).getData('text').trim();
    if (!txt) return;
    e.preventDefault();
    const v = caja.value, a = caja.selectionStart, b = caja.selectionEnd;
    const pre = v.slice(0, a), post = v.slice(b);
    const sep = pre && !pre.endsWith('\n') ? '\n' : '';
    const cuerpo = /^https?:\/\//i.test(txt) ? txt.split(/\s+/).join('\n') : txt;
    const fin = post.startsWith('\n') ? '' : '\n';
    caja.value = pre + sep + cuerpo + fin + post;
    caja.selectionStart = caja.selectionEnd = (pre + sep + cuerpo + fin).length;
    caja.scrollTop = caja.scrollHeight;
    contar();
  });
  caja.addEventListener('input', contar);

  // Guardado local: escribe directo en enlaces.txt (Chrome/Edge) y recuerda el archivo; si no se puede, lo descarga.
  const IDB = () => new Promise((ok, mal) => {
    const r = indexedDB.open('heleos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('archivos');
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
  });
  const idb = async (modo, valor) => {
    const db = await IDB();
    return new Promise((ok, mal) => {
      const tx = db.transaction('archivos', modo ? 'readwrite' : 'readonly').objectStore('archivos');
      const r = modo ? tx.put(valor, 'enlaces') : tx.get('enlaces');
      r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
    });
  };
  async function archivo() {
    let h = await idb().catch(() => null);
    if (h && (await h.queryPermission({ mode: 'readwrite' })) !== 'granted'
          && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') h = null;
    if (!h) {
      [h] = await window.showOpenFilePicker({ id: 'hofertas', types: [{ description: 'Lista de enlaces', accept: { 'text/plain': ['.txt'] } }] });
      await idb(true, h).catch(() => {});
    }
    return h;
  }
  /* GitHub: el repositorio es el punto de encuentro entre este panel, el monitoreo y el catálogo. */
  const GH = 'heleos.github'; // clave previa: conserva la conexión guardada
  const deducido = (() => {
    const m = location.hostname.match(/^([\w-]+)\.github\.io$/i), seg = location.pathname.split('/').filter(Boolean)[0];
    return m ? `${m[1]}/${seg && !seg.includes('.') ? seg : m[1] + '.github.io'}` : '';
  })();
  const ghCfg = () => { try { return JSON.parse(localStorage.getItem(GH)) || {}; } catch { return {}; } };
  const ghApi = async (cfg, ruta, op = {}) => {
    const r = await fetch(`https://api.github.com/repos/${cfg.repo}${ruta}`, { ...op, cache: 'no-store',
      headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json', ...(op.headers || {}) } });
    if (!r.ok && r.status !== 404) throw Object.assign(new Error(`GitHub respondió ${r.status}`), { status: r.status });
    return r.status === 404 ? null : r.json();
  };
  const b64 = { de: s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0))),
                a: s => btoa(String.fromCharCode(...new TextEncoder().encode(s))) };
  async function guardarGitHub(cfg, nuevos) {
    for (let intento = 0; intento < 2; intento++) {
      const f = await ghApi(cfg, '/contents/enlaces.txt');
      const previo = f ? b64.de(f.content) : '';
      const ya = new Set(previo.split(/\r?\n/).map(l => l.trim()).filter(Boolean));
      const agregar = nuevos.filter(u => !ya.has(u));
      if (!agregar.length) return { agregar, rep: nuevos.length };
      const base = previo.replace(/\s+$/, '');
      try {
        await ghApi(cfg, '/contents/enlaces.txt', { method: 'PUT', body: JSON.stringify({
          message: `Panel: +${agregar.length} ${agregar.length === 1 ? 'enlace' : 'enlaces'}`,
          content: b64.a((base ? base + '\n' : '') + agregar.join('\n') + '\n'), ...(f ? { sha: f.sha } : {}) }) });
        return { agregar, rep: nuevos.length - agregar.length };
      } catch (e) { if (e.status !== 409 || intento) throw e; } // alguien escribió al mismo tiempo: reintenta
    }
  }
  const conexion = $('conexion'), ajustes = $('ajustes'), ghEstado = $('gh-estado'), cajaEnlaces = $('caja-enlaces');
  function pintarConexion() {
    const c = ghCfg();
    $('gh-repo').value = c.repo || deducido;
    $('gh-token').value = c.token ? '••••••••' : '';
    ajustes.classList.toggle('text-lima', !!c.token);
    ghEstado.textContent = c.token ? `Conectado a ${c.repo}. "Guardar enlaces" escribe en el repositorio.` : 'Sin conexión: los enlaces se guardan en un archivo de esta computadora.';
  }
  ajustes.addEventListener('click', () => {
    const abrir = conexion.classList.contains('hidden');
    conexion.classList.toggle('hidden', !abrir); conexion.classList.toggle('flex', abrir);
    // Mientras se configura GitHub la caja crece; al cerrar vuelve a su altura fija.
    cajaEnlaces.classList.toggle('h-56', !abrir); cajaEnlaces.classList.toggle('h-auto', abrir);
    ajustes.setAttribute('aria-expanded', abrir);
    if (abrir) { pintarConexion(); $('gh-repo').focus(); }
  });
  conexion.addEventListener('submit', async e => {
    e.preventDefault();
    const repo = $('gh-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/+$/, '');
    const t = $('gh-token').value.trim(), token = /^•+$/.test(t) ? ghCfg().token : t;
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return (ghEstado.textContent = 'Escribe el repositorio como usuario/repositorio y el token.');
    ghEstado.textContent = 'Verificando…';
    try {
      const r = await ghApi({ repo, token }, '');
      if (!r) throw new Error('No encuentro ese repositorio con este token.');
      if (r.permissions && !r.permissions.push) throw new Error('El token no tiene permiso de escritura en ese repositorio.');
      try { localStorage.setItem(GH, JSON.stringify({ repo, token })); } catch {}
      pintarConexion();
    } catch (err) { ghEstado.textContent = err.status === 401 ? 'Token inválido o vencido.' : err.message; }
  });
  $('gh-olvidar').addEventListener('click', () => { try { localStorage.removeItem(GH); } catch {} pintarConexion(); });
  pintarConexion();

  guardar.addEventListener('click', async () => {
    const nuevos = validas();
    if (!nuevos.length) return;
    guardar.disabled = true;
    const cfg = ghCfg();
    if (cfg.token) {
      try {
        const { agregar, rep } = await guardarGitHub(cfg, nuevos);
        avisar(avisoM, (agregar.length ? `${agregar.length} ${agregar.length === 1 ? 'enlace guardado' : 'enlaces guardados'} en GitHub` : 'Nada nuevo') + (rep ? ` · ${rep} ya estaba${rep === 1 ? '' : 'n'}` : '') + '.');
        caja.value = '';
      } catch (e) {
        avisar(avisoM, e.status === 401 ? 'El token de GitHub ya no sirve: vuelve a conectarlo.' : `No se pudo guardar en GitHub (${e.message}).`);
      }
      return contar();
    }
    try {
      if (!window.showOpenFilePicker) throw Object.assign(new Error(), { name: 'SinAPI' });
      const h = await archivo();
      const previo = await (await h.getFile()).text();
      const ya = new Set(previo.split(/\r?\n/).map(l => l.trim()).filter(Boolean));
      const agregar = nuevos.filter(u => !ya.has(u));
      if (agregar.length) {
        const w = await h.createWritable({ keepExistingData: true });
        const base = previo.replace(/\s+$/, '');
        await w.truncate(0);
        await w.write((base ? base + '\n' : '') + agregar.join('\n') + '\n');
        await w.close();
      }
      const rep = nuevos.length - agregar.length;
      avisar(avisoM, `${agregar.length} ${agregar.length === 1 ? 'enlace guardado' : 'enlaces guardados'} en ${h.name}` + (rep ? ` · ${rep} ya estaba${rep === 1 ? '' : 'n'}` : '') + '.');
      caja.value = '';
      contar();
    } catch (e) {
      if (e.name === 'AbortError') { avisar(avisoM, 'Elige enlaces.txt para guardar.'); }
      else {
        const blob = new Blob([nuevos.join('\n') + '\n'], { type: 'text/plain' });
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'enlaces_nuevos.txt' });
        a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        avisar(avisoM, 'Se descargó enlaces_nuevos.txt: pega su contenido en enlaces.txt.');
      }
      contar();
    }
  });
  contar();

  /* ---------- Módulo IA · feed de súper ofertas (mismas tarjetas que app.html) ---------- */
  const reglas = [
    [/(\d{2,3})\s?hz/i, m => `${m[1]} Hz`],
    [/(\d{2}(?:[.,]\d)?)\s?(?:"|”|''|pulgadas|pulg\b)/i, m => `${m[1].replace(',', '.')}"`],
    [/\b(\d(?:\.\d)?)\s?ms\b/i, m => `${m[1]} ms`],
    [/inal[aá]mbric|bluetooth|wireless|\bbt\b/i, () => 'Inalámbrico'],
    [/(?<!in)al[aá]mbric|(?<!-)\bwired\b/i, () => 'Alámbrico'],
    [/mec[aá]nic|magn[eé]tic/i, m => /magn/i.test(m[0]) ? 'Magnético' : 'Mecánico'],
    [/cancelaci[oó]n|\banc\b/i, () => 'ANC'],
    [/(\d{3,5})\s?mah/i, m => `${m[1]} mAh`],
    [/(\d{2,4})\s?(gb|tb)\b/i, m => `${m[1]} ${m[2].toUpperCase()}`],
    [/\brgb\b/i, () => 'RGB']
  ];
  const specs = p => { const out = []; for (const [re, f] of reglas) { const m = p.t.match(re); if (m) out.push(f(m)); if (out.length === 3) break; } return out; };

  const feed = $('feed'), origen = $('origen');
  let P = [];
  feed.innerHTML = Array.from({ length: 4 }, () => `<li class="flex gap-4 rounded-2xl border border-linea bg-mate p-3"><div class="esq h-24 w-24 shrink-0 rounded-xl"></div><div class="flex-1 pt-1"><div class="esq h-4 w-3/4 rounded"></div><div class="esq mt-3 h-6 w-1/3 rounded"></div></div></li>`).join('');

  function tarjeta(p, k) {
    const s = specs(p);
    return `
    <li class="oferta rise rounded-2xl border border-linea bg-mate p-3" style="--i:${Math.min(k, 8)}">
      <div class="flex gap-4">
        <a ${enlace(p.link)} class="relative block h-24 w-24 shrink-0 overflow-hidden rounded-xl bg-white p-2" aria-label="Abrir ${esc(nombre(p))} en Mercado Libre">
          <img src="${esc(p.i)}" alt="" loading="lazy" class="h-full w-full object-contain">
          <span class="num absolute left-1 top-1 rounded-full bg-lima px-1.5 py-0.5 font-mono text-[11px] font-bold text-tinta">-${off(p)}%</span>
        </a>
        <div class="min-w-0 flex-1">
          <h3 class="line-clamp-2 text-[15px] font-semibold leading-snug text-zinc-50" title="${esc(p.t)}">${esc(nombre(p))}</h3>
          ${s.length ? `<p class="mt-1 truncate font-mono text-xs text-humo">${esc(s.join(' · '))}</p>` : ''}
          <p class="mt-2 flex items-baseline gap-2.5">
            <span class="num text-2xl font-extrabold tracking-tight text-lima">${mxn.format(p.n)}</span>
            <span class="num text-sm text-humo line-through">${mxn.format(p.o)}</span>
          </p>
        </div>
      </div>
      <div class="mt-3 grid grid-cols-2 gap-2">
        <button type="button" data-fondos="${k}" class="press flex items-center justify-center gap-2 rounded-full border border-linea bg-grafito py-3 text-sm font-semibold text-zinc-100 hover:border-zinc-500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.5-2h6l1.5 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
          Buscar fondos
        </button>
        <button type="button" data-guion="${k}" class="press btn-lima flex items-center justify-center gap-2 rounded-full py-3 text-sm font-semibold">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          Guion
        </button>
      </div>
    </li>`;
  }

  feed.addEventListener('click', e => {
    const f = e.target.closest('[data-fondos]'), g = e.target.closest('[data-guion]');
    if (f) window.open('https://www.pinterest.com/search/pins/?q=' + encodeURIComponent(nombre(P[f.dataset.fondos]) + ' aesthetic wallpaper'), '_blank', 'noopener');
    if (g) abrir(P[g.dataset.guion], g);
  });

  /* ---------- Guion (plantilla con los datos reales de la oferta) ---------- */
  function guion(p) {
    const s = specs(p), lista = s.length > 1 ? s.slice(0, -1).join(', ') + ' y ' + s[s.length - 1] : s[0];
    return [
      `¿Ibas a pagar <span class="text-zinc-400 line-through decoration-[3px]">${esc(mxn.format(p.o))}</span> por esto?`,
      `Hoy el <span class="text-lima">${esc(nombre(p))}</span> bajó a <span class="text-lima">${esc(mxn.format(p.n))}</span>.`,
      `Es <span class="text-lima">${off(p)}% menos</span>: te ahorras ${esc(mxn.format(p.o - p.n))}.`,
      lista ? `Datos clave: ${esc(lista)}. Mismo producto, mucho menos dinero.` : `Mismo producto, mucho menos dinero.`,
      `Revisamos el precio real todos los días; esta baja es de verdad.`,
      `El link está en mi perfil. Corre, que estos precios cambian rápido.`
    ];
  }

  /* ---------- Teleprompter ---------- */
  const prompter = $('prompter'), texto = $('guion');
  let regreso = null, tam = 2;
  try { tam = parseFloat(localStorage.getItem('h-prompter-panel')) || tam; } catch (e) {}
  const aplicarTam = () => { texto.style.setProperty('--tam', tam + 'rem'); try { localStorage.setItem('h-prompter-panel', tam); } catch (e) {} };
  aplicarTam();
  $('menos').addEventListener('click', () => { tam = Math.max(1.3, +(tam - .2).toFixed(1)); aplicarTam(); });
  $('mas').addEventListener('click', () => { tam = Math.min(3.4, +(tam + .2).toFixed(1)); aplicarTam(); });
  function abrir(p, boton) {
    regreso = boton;
    $('p-titulo').textContent = nombre(p);
    texto.innerHTML = guion(p).map(l => `<p>${l}</p>`).join('');
    texto.scrollTop = 0;
    prompter.classList.add('abierto');
    $('cerrar').focus();
  }
  function cerrar() {
    prompter.classList.remove('abierto');
    if (regreso) regreso.focus();
  }
  $('cerrar').addEventListener('click', cerrar);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && prompter.classList.contains('abierto')) cerrar(); });

  /* ---------- Datos ---------- */
  fetch('ofertas.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      P = (d.productos || [])
        .filter(p => p && /^https:\/\//.test(p.link) && /^(https:\/\/|[\w\/-]+\.(webp|jpe?g|png)$)/i.test(p.i) && p.n > 0 && p.n < p.o)
        .sort((x, y) => off(y) - off(x));
      const hora = d.actualizado ? new Date(d.actualizado).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      origen.textContent = `${P.length} súper ofertas` + (hora ? ` · actualizado ${hora}` : '');
      feed.innerHTML = P.length ? P.map(tarjeta).join('') : '<li class="py-16 text-center text-humo">Hoy no hay ofertas nuevas.</li>';
    })
    .catch(() => {
      origen.textContent = 'Sin conexión con ofertas.json';
      feed.innerHTML = '<li class="py-16 text-center text-humo">No pudimos cargar las ofertas. Recarga en un momento.</li>';
    });

  /* ---------- Reloj ---------- */
  const reloj = $('reloj');
  const tic = () => (reloj.textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
  tic(); setInterval(tic, 30000);
})();
</script>
</body>
</html>
