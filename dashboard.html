<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H | Ofertas · Centro de Control</title>
<meta name="theme-color" content="#0a0b0d">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { lima: '#c6f135', tinta: '#0a0b0d', grafito: '#101215', mate: '#15171b', alto: '#1b1e23', linea: '#24272d', humo: '#9aa0a8', ceniza: '#6b7079' },
    fontFamily: { sans: ['Poppins', 'ui-sans-serif', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] }
  } } };
</script>
<style>
  :root { --lima: #c6f135; --tinta: #0a0b0d; --ease: cubic-bezier(.16, 1, .3, 1); color-scheme: dark; }
  html, body { height: 100%; overflow: hidden; background: var(--tinta); }
  body { -webkit-text-size-adjust: 100%;
    background: radial-gradient(ellipse 50% 35% at 30% -5%, rgba(198,241,53,.06), transparent 70%), var(--tinta); }
  ::selection { background: var(--lima); color: var(--tinta); }
  textarea, input { caret-color: var(--lima); }
  .num { font-variant-numeric: tabular-nums; }

  /* Barras de scroll internas con la paleta */
  .scroll { scrollbar-width: thin; scrollbar-color: #2c3037 transparent; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: #2c3037; border-radius: 9999px; border: 2px solid var(--tinta); }

  /* Entrada en cascada */
  @keyframes rise { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
  .rise { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 80ms); }

  /* Visor: luz lima mientras carga Mercado Libre */
  .halo { background: radial-gradient(circle, rgba(198,241,53,.35) 0%, rgba(198,241,53,.1) 40%, transparent 68%); filter: blur(10px); }
  @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: .95; transform: scale(1.08); } }
  .halo { animation: pulse 2.4s ease-in-out infinite; }
  #frame { opacity: 0; filter: blur(12px); transform: scale(1.01); transition: opacity .7s ease, filter .9s ease, transform 1s var(--ease); }
  #visor.listo #frame { opacity: 1; filter: none; transform: none; }
  #carga { transition: opacity .4s ease; }
  #visor.listo #carga { opacity: 0; pointer-events: none; }

  /* Controles */
  .press { transition: transform 160ms var(--ease), filter 160ms ease, background-color 160ms ease, color 160ms ease, border-color 160ms ease, opacity 160ms ease; }
  .press:active:not(:disabled) { transform: scale(.97); }
  .btn-lima { background: var(--lima); color: var(--tinta); }
  .btn-lima:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-lima:disabled { background: rgba(198,241,53,.12); color: rgba(198,241,53,.6); cursor: not-allowed; }
  .campo { background: #101215; border: 1px solid #24272d; transition: border-color 160ms ease, background-color 160ms ease; }
  .campo:hover { border-color: #33373f; }
  .campo:focus { outline: none; border-color: rgba(198,241,53,.55); background: #121417; }
  .campo::placeholder { color: #6b7079; }

  /* Alertas */
  @keyframes flash-in { from { opacity: 0; translate: 0 -8px; filter: blur(4px); } to { opacity: 1; translate: 0 0; filter: none; } }
  @keyframes flash-borde { from { border-color: rgba(198,241,53,.7); } to { border-color: #24272d; } }
  .alerta { background: #15171b; border: 1px solid #24272d; transition: border-color 160ms ease; }
  .alerta.nueva { animation: flash-in 300ms var(--ease) both, flash-borde 1.6s ease-out 300ms both; }
  .alerta:hover { border-color: #3a3f2a; }

  /* Aviso de estado bajo cada botón */
  .aviso { transition: opacity 220ms ease, translate 220ms var(--ease); }
  .aviso:empty { opacity: 0; translate: 0 -4px; }

  @keyframes latido { 0% { box-shadow: 0 0 0 0 rgba(198,241,53,.55); } 70%, 100% { box-shadow: 0 0 0 6px rgba(198,241,53,0); } }
  .latido { animation: latido 2.4s ease-out infinite; }

  a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--lima); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .rise, .halo, .latido, .alerta.nueva { animation: none; }
    #frame, #carga, .press, .campo, .aviso { transition: none; }
    #frame { filter: none; transform: none; }
  }
</style>
</head>
<body class="font-sans text-zinc-100 antialiased">

<div class="grid h-[100dvh] grid-rows-[58dvh_1fr] gap-3 p-3 lg:grid-cols-[minmax(0,7fr)_minmax(0,3fr)] lg:grid-rows-1">

  <!-- ═══════════ ÁREA PRINCIPAL (70 %) · Mercado Libre Afiliados ═══════════ -->
  <section id="visor" class="rise relative flex min-h-0 flex-col overflow-hidden rounded-3xl border border-linea bg-grafito" style="--i:0" aria-label="Mercado Libre Afiliados">
    <form id="ir" class="flex items-center gap-1.5 border-b border-linea bg-tinta/70 px-3 py-2 backdrop-blur-md">
      <button type="button" id="inicio" class="press grid h-9 w-9 shrink-0 place-items-center rounded-full text-zinc-300 hover:bg-white/5 hover:text-zinc-100" aria-label="Ir a Mercado Libre Afiliados" title="Afiliados">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z"/></svg>
      </button>
      <button type="button" id="recargar" class="press grid h-9 w-9 shrink-0 place-items-center rounded-full text-zinc-300 hover:bg-white/5 hover:text-zinc-100" aria-label="Recargar" title="Recargar">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2"/></svg>
      </button>
      <label class="relative min-w-0 flex-1">
        <span class="sr-only">Buscar en Mercado Libre o pegar una URL</span>
        <svg class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-ceniza" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 3.5 3.5"/></svg>
        <input id="destino" type="text" autocomplete="off" spellcheck="false" placeholder="Buscar en Mercado Libre o pegar URL…" class="campo h-9 w-full rounded-full pl-10 pr-4 text-sm text-zinc-100">
      </label>
      <button type="button" id="ventana" class="press flex h-9 shrink-0 items-center gap-2 rounded-full border border-linea px-3.5 text-xs font-semibold text-zinc-200 hover:border-zinc-500" title="Abre Mercado Libre en una ventana acoplada sobre este visor, con tu sesión iniciada">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3h6v6M17 3l-7.5 7.5M14.5 12v3.5a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 15.5V7a1.5 1.5 0 0 1 1.5-1.5H8"/></svg>
        <span class="hidden xl:inline">Abrir acoplado</span>
      </button>
    </form>
    <p class="flex items-center justify-between gap-3 border-b border-linea bg-mate px-4 py-1.5 text-xs text-humo">
      <span>¿Visor en blanco? Mercado Libre bloquea el iframe cuando hay sesión iniciada.</span>
      <button type="button" id="ventana2" class="press shrink-0 rounded-full px-2.5 py-1 font-semibold text-lima hover:bg-lima/10">Abrir acoplado</button>
    </p>
    <div class="relative min-h-0 flex-1">
      <iframe id="frame" title="Mercado Libre Afiliados" src="https://www.mercadolibre.com.mx/afiliados"
              class="absolute inset-0 h-full w-full border-0 bg-white"
              referrerpolicy="strict-origin-when-cross-origin"
              allow="clipboard-read; clipboard-write"></iframe>
      <div id="carga" class="absolute inset-0 flex flex-col items-center justify-center gap-5 bg-grafito" aria-live="polite">
        <div class="relative grid h-40 w-40 place-items-center">
          <div class="halo absolute inset-0 rounded-full"></div>
          <span class="relative h-3 w-3 rounded-full bg-lima"></span>
        </div>
        <p class="text-sm text-humo">Conectando con Mercado Libre…</p>
      </div>
    </div>
  </section>

  <!-- ═══════════ PANEL LATERAL (30 %) ═══════════ -->
  <aside class="flex min-h-0 flex-col gap-3" aria-label="Panel de control">

    <!-- CAJA SUPERIOR · Ingreso de enlaces -->
    <section class="rise flex min-h-0 flex-[1.05] flex-col rounded-3xl border border-linea bg-grafito p-4" style="--i:1" aria-labelledby="t-enlaces">
      <header class="flex items-center justify-between gap-3">
        <h2 id="t-enlaces" class="flex items-baseline gap-2 text-[15px] font-semibold tracking-tight">
          <span class="flex items-baseline font-extrabold"><span>H</span><span class="mx-1 font-normal text-ceniza">|</span><span>Ofertas</span><span class="ml-0.5 inline-block h-1.5 w-1.5 rounded-full bg-lima"></span></span>
          <span class="text-humo">Enlaces</span>
        </h2>
        <span class="flex items-center gap-1">
          <span id="conteo" class="num font-mono text-[11px] text-humo">0 enlaces</span>
          <button id="ajustes" type="button" class="press -mr-1.5 grid h-8 w-8 place-items-center rounded-full text-humo hover:bg-white/5 hover:text-zinc-100" aria-label="Conexión con GitHub" aria-expanded="false" aria-controls="conexion" title="Conexión con GitHub">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5L9.8 5.2M12 8a3.5 3.5 0 0 0-5 0L4.5 10.5a3.5 3.5 0 0 0 5 5l.7-.7"/></svg>
          </button>
        </span>
      </header>
      <!-- Conexión con GitHub: guarda enlaces.txt en el repositorio -->
      <form id="conexion" class="mt-3 hidden flex-col gap-2 border-b border-linea pb-3">
        <label class="text-xs text-humo" for="gh-repo">Repositorio</label>
        <input id="gh-repo" type="text" autocomplete="off" spellcheck="false" placeholder="usuario/repositorio" class="campo h-9 rounded-full px-4 font-mono text-[12px] text-zinc-100">
        <label class="text-xs text-humo" for="gh-token">Token (solo Contents: lectura y escritura)</label>
        <input id="gh-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" class="campo h-9 rounded-full px-4 font-mono text-[12px] text-zinc-100">
        <div class="mt-1 flex items-center gap-2">
          <button type="submit" class="press flex-1 rounded-full border border-linea py-2 text-xs font-semibold text-zinc-100 hover:border-zinc-500">Conectar</button>
          <button type="button" id="gh-olvidar" class="press rounded-full px-3 py-2 text-xs text-humo hover:text-zinc-100">Olvidar</button>
        </div>
        <p id="gh-estado" class="text-xs text-humo" role="status"></p>
      </form>
      <label for="municion" class="sr-only">Enlaces de afiliado, uno por línea</label>
      <textarea id="municion" spellcheck="false" autocomplete="off"
                placeholder="https://meli.la/…&#10;Pega con Ctrl+V: cada enlace queda en su línea"
                class="campo scroll mt-3 block min-h-[6rem] w-full flex-1 resize-none rounded-2xl px-4 py-3 font-mono text-[12.5px] leading-6 text-zinc-200"></textarea>
      <button id="guardar" type="button" class="press btn-lima mt-3 block w-full shrink-0 rounded-full py-3 text-sm font-semibold" disabled>Guardar enlaces</button>
      <p id="aviso-municion" class="aviso mt-1.5 min-h-[1rem] shrink-0 text-xs text-humo" role="status"></p>
    </section>

    <!-- CAJA INFERIOR · Módulo IA -->
    <section class="rise flex min-h-0 flex-1 flex-col overflow-hidden rounded-3xl border border-linea bg-grafito" style="--i:2" aria-labelledby="t-ia">
      <header class="flex shrink-0 items-center justify-between gap-3 px-4 pt-4">
        <h2 id="t-ia" class="flex items-center gap-2 text-[15px] font-semibold tracking-tight">
          <span class="latido h-1.5 w-1.5 rounded-full bg-lima" aria-hidden="true"></span>Módulo IA
        </h2>
        <span id="reloj" class="num font-mono text-[11px] text-humo"></span>
      </header>

      <!-- Mitad 1: alertas -->
      <div class="flex min-h-0 flex-1 flex-col px-4 pb-3 pt-3">
        <div class="flex items-center justify-between gap-2">
          <h3 class="text-xs font-semibold text-zinc-300">Alertas de precio</h3>
          <button id="simular" type="button" class="press rounded-full border border-linea px-2.5 py-1 text-[11px] font-medium text-zinc-300 hover:border-zinc-500 hover:text-zinc-100">Simular alerta</button>
        </div>
        <p id="origen" class="mt-0.5 truncate font-mono text-[10.5px] text-ceniza"></p>
        <ol id="alertas" class="scroll -mr-2 mt-2 flex min-h-0 flex-1 flex-col gap-1.5 overflow-y-auto pr-2" aria-live="polite"></ol>
      </div>

      <!-- Mitad 2: buscador aesthetic -->
      <div class="shrink-0 border-t border-linea bg-mate/60 px-4 pb-4 pt-3">
        <h3 class="text-xs font-semibold text-zinc-300">Buscador aesthetic</h3>
        <form id="foto" class="mt-2 flex gap-2">
          <label for="sku" class="sr-only">SKU o ID del producto</label>
          <input id="sku" type="text" autocomplete="off" spellcheck="false" placeholder="SKU o ID · ej. Aula Win60HE"
                 class="campo h-10 min-w-0 flex-1 rounded-full px-4 text-sm text-zinc-100">
          <button id="buscar" type="submit" class="press btn-lima grid h-10 shrink-0 place-items-center rounded-full px-4 text-sm font-semibold" disabled>
            Buscar
          </button>
        </form>
        <p class="mt-1.5 text-[11px] text-ceniza">Abre Pinterest con fondos aesthetic de ese producto.</p>
      </div>
    </section>
  </aside>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const AFILIADOS = 'https://www.mercadolibre.com.mx/afiliados';

  /* ---------- Visor ---------- */
  const visor = $('visor'), frame = $('frame'), destino = $('destino');
  let actual = AFILIADOS;
  frame.addEventListener('load', () => visor.classList.add('listo'));
  function navegar(url) {
    actual = url;
    visor.classList.remove('listo');
    frame.src = url;
  }
  function resolver(txt) {
    const t = txt.trim();
    if (!t) return AFILIADOS;
    if (/^https?:\/\//i.test(t)) return t;
    if (/^(www\.)?[\w-]+\.[\w.-]+(\/|$)/i.test(t)) return 'https://' + t;
    return 'https://listado.mercadolibre.com.mx/' + encodeURIComponent(t.replace(/\s+/g, '-'));
  }
  $('ir').addEventListener('submit', e => { e.preventDefault(); navegar(resolver(destino.value)); destino.blur(); });
  $('inicio').addEventListener('click', () => { destino.value = ''; navegar(AFILIADOS); });
  $('recargar').addEventListener('click', () => navegar(actual));

  // Ventana acoplada: misma posición y tamaño que el visor, con la sesión real del navegador.
  let pop;
  $('ventana2').addEventListener('click', () => $('ventana').click());
  $('ventana').addEventListener('click', () => {
    const r = visor.getBoundingClientRect();
    const bx = window.screenX + (window.outerWidth - window.innerWidth) / 2;
    const by = window.screenY + (window.outerHeight - window.innerHeight);
    const f = `popup=yes,left=${Math.round(bx + r.left)},top=${Math.round(by + r.top)},width=${Math.round(r.width)},height=${Math.round(r.height)}`;
    pop = window.open(actual, 'hofertas-visor', f) || pop;
    if (pop) pop.focus();
  });

  /* ---------- Ingreso de enlaces ---------- */
  const caja = $('municion'), guardar = $('guardar'), avisoM = $('aviso-municion'), conteo = $('conteo');
  const BORRADOR = 'heleos.municion'; // clave previa: conserva el borrador guardado
  try { caja.value = localStorage.getItem(BORRADOR) || ''; } catch {}

  const lineas = () => caja.value.split('\n').map(l => l.trim()).filter(Boolean);
  const validas = () => [...new Set(lineas().filter(l => /^https?:\/\/\S+$/i.test(l)))];
  function contar() {
    const ls = lineas(), vs = validas(), malas = ls.filter(l => !/^https?:\/\/\S+$/i.test(l)).length;
    conteo.textContent = `${vs.length} ${vs.length === 1 ? 'enlace' : 'enlaces'}` + (malas ? ` · ${malas} sin URL` : '');
    conteo.classList.toggle('text-lima', malas > 0);
    guardar.disabled = !vs.length;
    try { localStorage.setItem(BORRADOR, caja.value); } catch {}
  }
  let avisoT;
  function avisar(el, txt) { clearTimeout(avisoT); el.textContent = txt; avisoT = setTimeout(() => (el.textContent = ''), 6000); }

  // Enter al final de un enlace: limpia espacios y salta a una línea nueva limpia.
  caja.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    const v = caja.value, a = caja.selectionStart, b = caja.selectionEnd;
    const inicio = v.lastIndexOf('\n', a - 1) + 1;
    const antes = v.slice(0, inicio) + v.slice(inicio, a).trimEnd();
    caja.value = antes + '\n' + v.slice(b).replace(/^[ \t]+/, '');
    caja.selectionStart = caja.selectionEnd = antes.length + 1;
    contar();
  });
  // Ctrl+V: cada pegado queda en su propia línea y el cursor espera en el renglón de abajo.
  caja.addEventListener('paste', e => {
    const txt = (e.clipboardData || window.clipboardData).getData('text').trim();
    if (!txt) return;
    e.preventDefault();
    const v = caja.value, a = caja.selectionStart, b = caja.selectionEnd;
    const pre = v.slice(0, a), post = v.slice(b);
    const sep = pre && !pre.endsWith('\n') ? '\n' : '';
    const cuerpo = /^https?:\/\//i.test(txt) ? txt.split(/\s+/).join('\n') : txt;
    const fin = post.startsWith('\n') ? '' : '\n';
    caja.value = pre + sep + cuerpo + fin + post;
    caja.selectionStart = caja.selectionEnd = (pre + sep + cuerpo + fin).length;
    contar();
  });
  caja.addEventListener('input', contar);

  // Guardado local: escribe directo en enlaces.txt (Chrome/Edge) y recuerda el archivo; si no se puede, lo descarga.
  const IDB = () => new Promise((ok, mal) => {
    const r = indexedDB.open('heleos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('archivos');
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
  });
  const idb = async (modo, valor) => {
    const db = await IDB();
    return new Promise((ok, mal) => {
      const tx = db.transaction('archivos', modo ? 'readwrite' : 'readonly').objectStore('archivos');
      const r = modo ? tx.put(valor, 'enlaces') : tx.get('enlaces');
      r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
    });
  };
  async function archivo() {
    let h = await idb().catch(() => null);
    if (h && (await h.queryPermission({ mode: 'readwrite' })) !== 'granted'
          && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') h = null;
    if (!h) {
      [h] = await window.showOpenFilePicker({ id: 'hofertas', types: [{ description: 'Lista de enlaces', accept: { 'text/plain': ['.txt'] } }] });
      await idb(true, h).catch(() => {});
    }
    return h;
  }
  /* GitHub: el repositorio es el punto de encuentro entre este panel, el monitoreo y el catálogo. */
  const GH = 'heleos.github'; // clave previa: conserva la conexión guardada
  const deducido = (() => {
    const m = location.hostname.match(/^([\w-]+)\.github\.io$/i), seg = location.pathname.split('/').filter(Boolean)[0];
    return m ? `${m[1]}/${seg && !seg.includes('.') ? seg : m[1] + '.github.io'}` : '';
  })();
  const ghCfg = () => { try { return JSON.parse(localStorage.getItem(GH)) || {}; } catch { return {}; } };
  const ghApi = async (cfg, ruta, op = {}) => {
    const r = await fetch(`https://api.github.com/repos/${cfg.repo}${ruta}`, { ...op, cache: 'no-store',
      headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json', ...(op.headers || {}) } });
    if (!r.ok && r.status !== 404) throw Object.assign(new Error(`GitHub respondió ${r.status}`), { status: r.status });
    return r.status === 404 ? null : r.json();
  };
  const b64 = { de: s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0))),
                a: s => btoa(String.fromCharCode(...new TextEncoder().encode(s))) };
  async function guardarGitHub(cfg, nuevos) {
    for (let intento = 0; intento < 2; intento++) {
      const f = await ghApi(cfg, '/contents/enlaces.txt');
      const previo = f ? b64.de(f.content) : '';
      const ya = new Set(previo.split(/\r?\n/).map(l => l.trim()).filter(Boolean));
      const agregar = nuevos.filter(u => !ya.has(u));
      if (!agregar.length) return { agregar, rep: nuevos.length };
      const base = previo.replace(/\s+$/, '');
      try {
        await ghApi(cfg, '/contents/enlaces.txt', { method: 'PUT', body: JSON.stringify({
          message: `Panel: +${agregar.length} ${agregar.length === 1 ? 'enlace' : 'enlaces'}`,
          content: b64.a((base ? base + '\n' : '') + agregar.join('\n') + '\n'), ...(f ? { sha: f.sha } : {}) }) });
        return { agregar, rep: nuevos.length - agregar.length };
      } catch (e) { if (e.status !== 409 || intento) throw e; } // alguien escribió al mismo tiempo: reintenta
    }
  }
  const conexion = $('conexion'), ajustes = $('ajustes'), ghEstado = $('gh-estado');
  function pintarConexion() {
    const c = ghCfg();
    $('gh-repo').value = c.repo || deducido;
    $('gh-token').value = c.token ? '••••••••' : '';
    ajustes.classList.toggle('text-lima', !!c.token);
    ghEstado.textContent = c.token ? `Conectado a ${c.repo}. "Guardar enlaces" escribe en el repositorio.` : 'Sin conexión: los enlaces se guardan en un archivo de esta computadora.';
  }
  ajustes.addEventListener('click', () => {
    const abrir = conexion.classList.contains('hidden');
    conexion.classList.toggle('hidden', !abrir); conexion.classList.toggle('flex', abrir);
    ajustes.setAttribute('aria-expanded', abrir);
    if (abrir) { pintarConexion(); $('gh-repo').focus(); }
  });
  conexion.addEventListener('submit', async e => {
    e.preventDefault();
    const repo = $('gh-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/+$/, '');
    const t = $('gh-token').value.trim(), token = /^•+$/.test(t) ? ghCfg().token : t;
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return (ghEstado.textContent = 'Escribe el repositorio como usuario/repositorio y el token.');
    ghEstado.textContent = 'Verificando…';
    try {
      const r = await ghApi({ repo, token }, '');
      if (!r) throw new Error('No encuentro ese repositorio con este token.');
      if (r.permissions && !r.permissions.push) throw new Error('El token no tiene permiso de escritura en ese repositorio.');
      try { localStorage.setItem(GH, JSON.stringify({ repo, token })); } catch {}
      pintarConexion();
    } catch (err) { ghEstado.textContent = err.status === 401 ? 'Token inválido o vencido.' : err.message; }
  });
  $('gh-olvidar').addEventListener('click', () => { try { localStorage.removeItem(GH); } catch {} pintarConexion(); });
  pintarConexion();

  guardar.addEventListener('click', async () => {
    const nuevos = validas();
    if (!nuevos.length) return;
    guardar.disabled = true;
    const cfg = ghCfg();
    if (cfg.token) {
      try {
        const { agregar, rep } = await guardarGitHub(cfg, nuevos);
        avisar(avisoM, (agregar.length ? `${agregar.length} ${agregar.length === 1 ? 'enlace guardado' : 'enlaces guardados'} en GitHub` : 'Nada nuevo') + (rep ? ` · ${rep} ya estaba${rep === 1 ? '' : 'n'}` : '') + '. Entran en la próxima actualización.');
        caja.value = '';
      } catch (e) {
        avisar(avisoM, e.status === 401 ? 'El token de GitHub ya no sirve: vuelve a conectarlo.' : `No se pudo guardar en GitHub (${e.message}). Tus enlaces siguen en la caja.`);
      }
      return contar();
    }
    try {
      if (!window.showOpenFilePicker) throw Object.assign(new Error(), { name: 'SinAPI' });
      const h = await archivo();
      const previo = await (await h.getFile()).text();
      const ya = new Set(previo.split(/\r?\n/).map(l => l.trim()).filter(Boolean));
      const agregar = nuevos.filter(u => !ya.has(u));
      if (agregar.length) {
        const w = await h.createWritable({ keepExistingData: true });
        const base = previo.replace(/\s+$/, '');
        await w.truncate(0);
        await w.write((base ? base + '\n' : '') + agregar.join('\n') + '\n');
        await w.close();
      }
      const rep = nuevos.length - agregar.length;
      avisar(avisoM, `${agregar.length} ${agregar.length === 1 ? 'enlace guardado' : 'enlaces guardados'} en ${h.name}` + (rep ? ` · ${rep} ya estaba${rep === 1 ? '' : 'n'}` : '') + '. Entran en la próxima actualización.');
      caja.value = '';
      contar();
    } catch (e) {
      if (e.name === 'AbortError') { avisar(avisoM, 'Elige enlaces.txt para guardar.'); }
      else {
        const blob = new Blob([nuevos.join('\n') + '\n'], { type: 'text/plain' });
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'enlaces_nuevos.txt' });
        a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        avisar(avisoM, 'Este navegador no deja escribir en enlaces.txt: se descargó enlaces_nuevos.txt para pegarlos ahí.');
      }
      contar();
    }
  });
  contar();

  /* ---------- Módulo IA · alertas ---------- */
  const lista = $('alertas'), origen = $('origen');
  const off = p => Math.round((1 - p.n / p.o) * 100);
  const corto = t => t.split(/[,\-–|(]/)[0].trim().split(/\s+/).slice(0, 5).join(' ');
  let pool = [], hist = {}, sim = 0;
  const DEMO = [
    { t: 'Teclado mecánico compacto 75% inalámbrico', o: 1799, n: 1079, i: '', link: AFILIADOS },
    { t: 'Audífonos inalámbricos con cancelación de ruido', o: 1899, n: 1199, i: '', link: AFILIADOS },
    { t: 'Monitor gamer curvo 27 pulgadas QHD 165 Hz', o: 5499, n: 3899, i: '', link: AFILIADOS }
  ];
  const vacio = () => {
    if (lista.children.length) return;
    lista.innerHTML = `<li class="vacio flex flex-1 flex-col items-center justify-center gap-1 py-4 text-center">
      <p class="text-sm text-humo">Sin alertas por ahora</p>
      <p class="text-xs text-ceniza">Aparecen aquí cuando un precio baja.</p></li>`;
  };
  function alerta(p, nota, nueva = true) {
    lista.querySelector('.vacio')?.remove();
    const li = document.createElement('li');
    li.className = 'alerta shrink-0 rounded-2xl' + (nueva ? ' nueva' : '');
    const img = /^https:\/\//.test(p.i)
      ? `<img src="${esc(p.i)}" alt="" class="h-10 w-10 shrink-0 rounded-xl bg-white object-contain p-0.5" loading="lazy">`
      : `<span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-alto text-lima" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>`;
    li.innerHTML = `<button type="button" class="press flex w-full items-center gap-2.5 rounded-2xl p-2 text-left" title="Abrir en el visor">
      ${img}
      <span class="min-w-0 flex-1">
        <span class="block truncate text-[12.5px] leading-5 text-zinc-100"><span class="font-semibold text-lima">${esc(corto(p.t))}</span> bajó un ${off(p)}%</span>
        <span class="mt-0.5 flex items-baseline gap-2">
          <span class="num font-mono text-[13px] font-semibold text-lima">${mxn.format(p.n)}</span>
          <span class="num font-mono text-[11px] text-ceniza line-through">${mxn.format(p.o)}</span>
          <span class="truncate text-[10.5px] text-ceniza">${esc(nota)}</span>
        </span>
      </span>
    </button>`;
    li.querySelector('button').addEventListener('click', () => navegar(p.link));
    lista.prepend(li);
    while (lista.children.length > 30) lista.lastElementChild.remove();
  }
  // Baja real: último precio contra el anterior en historial.json.
  function bajas() {
    return pool.map(p => {
      const h = hist[p.link] || [];
      const [a, b] = h.slice(-2);
      return a && b && b.precio < a.precio ? { p, nota: `bajó ${mxn.format(a.precio - b.precio)}` } : null;
    }).filter(Boolean);
  }
  $('simular').addEventListener('click', () => {
    const base = pool.length ? pool : DEMO;
    const p = { ...base[sim++ % base.length] };
    const caida = Math.max(1, Math.round(p.n * (0.04 + Math.random() * 0.08)));
    p.n = p.n - caida;
    alerta(p, 'simulada');
  });
  Promise.all([
    fetch('ofertas.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)),
    fetch('historial.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  ]).then(([d, h]) => {
    pool = (d.productos || []).filter(p => p && p.n > 0 && p.n < p.o && /^https:\/\//.test(p.link));
    hist = h || {};
    const hora = d.actualizado ? new Date(d.actualizado).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    origen.textContent = `${pool.length} ofertas` + (hora ? ` · actualizado ${hora}` : '');
    const hace = f => { const m = Math.round((Date.now() - new Date(f)) / 60000);
      return m < 60 ? `hace ${Math.max(1, m)} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };
    const detectadas = (d.alertas || []).filter(a => a && a.ahora > 0 && /^https:\/\//.test(a.link))
      .map(a => ({ p: { t: a.t, i: a.i, n: a.ahora, o: Math.max(a.o || a.antes, a.ahora), link: a.link }, nota: hace(a.fecha) }));
    (detectadas.length ? detectadas : bajas()).slice(0, 8).reverse().forEach(x => alerta(x.p, x.nota, false));
    vacio();
  }).catch(() => {
    origen.textContent = 'Sin conexión con ofertas.json · usa "Simular alerta"';
    vacio();
  });

  /* ---------- Módulo IA · buscador aesthetic ---------- */
  const sku = $('sku'), buscar = $('buscar');
  sku.addEventListener('input', () => (buscar.disabled = !sku.value.trim()));
  $('foto').addEventListener('submit', e => {
    e.preventDefault();
    const q = sku.value.trim();
    if (!q) return;
    window.open('https://www.pinterest.com/search/pins/?q=' + encodeURIComponent(q + ' aesthetic wallpaper'), '_blank', 'noopener');
  });

  /* ---------- Reloj ---------- */
  const reloj = $('reloj');
  const tic = () => (reloj.textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
  tic(); setInterval(tic, 30000);
})();
</script>
</body>
</html>
